<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Cyberpunk 2077 V inspired avatar -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="neonYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcee09"/>
      <stop offset="100%" stop-color="#ff9600"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="100,5 175,45 175,125 100,165 25,125 25,45"/>
    </clipPath>
  </defs>

  <!-- Hexagonal background -->
  <polygon points="100,5 175,45 175,125 100,165 25,125 25,45"
    fill="url(#bgGrad)" stroke="url(#neonYellow)" stroke-width="3" filter="url(#glow)"/>

  <!-- Hair / Head top -->
  <ellipse cx="100" cy="55" rx="38" ry="32" fill="#1a1a2e" stroke="url(#neonCyan)" stroke-width="1.5"/>
  <rect x="62" y="50" width="76" height="22" rx="11" fill="#1a1a2e"/>

  <!-- Face -->
  <ellipse cx="100" cy="72" rx="30" ry="28" fill="#2a1a1a"/>

  <!-- Eyes - cyberpunk visor style -->
  <rect x="76" y="64" width="48" height="14" rx="7" fill="#0a0a0f" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="100" y1="64" x2="100" y2="78" stroke="url(#neonCyan)" stroke-width="1"/>
  <circle cx="88" cy="71" r="3" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="112" cy="71" r="3" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Jaw -->
  <path d="M75 82 Q100 105 125 82" stroke="#2a1a1a" stroke-width="2" fill="#2a1a1a"/>

  <!-- Jacket collar -->
  <path d="M60 95 L85 85 L100 115 L115 85 L140 95" stroke="url(#neonYellow)" stroke-width="2" fill="none" filter="url(#glow)"/>
  <path d="M60 95 L85 85 L100 115 L115 85 L140 95" fill="#1a1a2e" stroke="none" opacity="0.8"/>

  <!-- Cybernetic implants - cheek lines -->
  <line x1="72" y1="78" x2="60" y2="90" stroke="url(#neonYellow)" stroke-width="1" filter="url(#glow)"/>
  <line x1="128" y1="78" x2="140" y2="90" stroke="url(#neonYellow)" stroke-width="1" filter="url(#glow)"/>

  <!-- Neck -->
  <rect x="88" y="95" width="24" height="20" fill="#1a1a2e"/>

  <!-- Cybernetic neck lines -->
  <line x1="88" y1="100" x2="112" y2="100" stroke="url(#neonCyan)" stroke-width="1" opacity="0.6"/>
  <line x1="88" y1="105" x2="112" y2="105" stroke="url(#neonCyan)" stroke-width="1" opacity="0.6"/>
  <line x1="88" y1="110" x2="112" y2="110" stroke="url(#neonCyan)" stroke-width="1" opacity="0.6"/>
</svg>
